name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3

      - name: Cache Zig toolchain
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion', 'scripts/install-zig.sh') }}

      - name: Install pinned Zig toolchain
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: sh scripts/install-zig.sh

      - name: Verify Zig toolchain
        run: |
          version=$(cat .zigversion)
          zig_bin="$GITHUB_WORKSPACE/.toolchain/zig-x86_64-linux-$version/zig"
          "$zig_bin" version
          echo "$GITHUB_WORKSPACE/.toolchain/zig-x86_64-linux-$version" >> $GITHUB_PATH

      - name: Run validation checks
        run: |
          version=$(cat .zigversion)
          ZIG="$GITHUB_WORKSPACE/.toolchain/zig-x86_64-linux-$version/zig" sh scripts/check.sh
